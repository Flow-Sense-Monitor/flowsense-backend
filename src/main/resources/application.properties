spring.application.name=flowsense

# Todas as configurações sensíveis vêm de variáveis de ambiente (veja .env.example na raiz do projeto).
# Os valores depois dos ":" são padrões para desenvolvimento local, nunca senhas.
server.port=${SERVER_PORT:8080}

# ---------- Banco de dados (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flowsense?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:flowsense}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# O Flyway cria e versiona as tabelas (src/main/resources/db/migration); o Hibernate só confere.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- MQTT ----------
flowsense.mqtt.host=${MQTT_HOST:broker.hivemq.com}
flowsense.mqtt.porta=${MQTT_PORT:1883}
flowsense.mqtt.usuario=${MQTT_USER:}
flowsense.mqtt.senha=${MQTT_PASSWORD:}
flowsense.mqtt.tls=${MQTT_TLS:false}

# ---------- Regras do FlowSense ----------
# Só aceita mensagens destes dispositivos (o broker é público); separados por vírgula.
flowsense.dispositivos=${FLOWSENSE_DISPOSITIVOS:esp32-01}
# Chave exigida no cabeçalho X-API-Key para enviar comandos (POST/PUT). Sem chave configurada, os comandos ficam bloqueados.
flowsense.api-key=${FLOWSENSE_API_KEY:}
# Tarifa usada no custo estimado, em R$/kWh.
flowsense.tarifa-kwh=${FLOWSENSE_TARIFA_KWH:0.95}
# Origens que podem chamar a API pelo navegador (CORS); separadas por vírgula.
flowsense.cors-origens=${FLOWSENSE_CORS_ORIGENS:http://localhost:5173}
# Histórico e eventos mais antigos que isso são apagados uma vez por dia (protege o disco da VM).
flowsense.retencao-dias=${FLOWSENSE_RETENCAO_DIAS:90}
